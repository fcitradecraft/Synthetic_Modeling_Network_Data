<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lasater Machine — Generate Exercise</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    line-height: 1.4;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.subtitle { color: #666; margin-top: 0; margin-bottom: 2rem; }
  form { display: grid; gap: 1rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  label { display: block; font-weight: 600; margin-bottom: 0.25rem; font-size: 0.9rem; }
  .hint { font-weight: 400; color: #888; font-size: 0.8rem; }
  input, select {
    width: 100%;
    padding: 0.5rem;
    font-size: 1rem;
    box-sizing: border-box;
    border: 1px solid #bbb;
    border-radius: 6px;
  }
  button {
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: #1a73e8;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #999; cursor: default; }
  #status { margin-top: 1rem; font-size: 0.9rem; white-space: pre-wrap; }
  #status.error { color: #c0392b; }
  #status.info { color: #555; }
</style>
</head>
<body>
  <h1>Lasater Machine</h1>
  <p class="subtitle">Generate an AML alert-clearing exercise and download the files.</p>

  <form id="run-form">
    <div class="row">
      <div>
        <label for="n_persons">Persons <span class="hint">(max 22)</span></label>
        <input type="number" id="n_persons" name="n_persons" min="1" value="6" required>
      </div>
      <div>
        <label for="n_companies">Companies <span class="hint">(max 34)</span></label>
        <input type="number" id="n_companies" name="n_companies" min="1" value="10" required>
      </div>
    </div>

    <div>
      <label for="n_flagged">Flagged accounts <span class="hint">(0 = clean output only)</span></label>
      <input type="number" id="n_flagged" name="n_flagged" min="0" value="3">
    </div>

    <div class="row">
      <div>
        <label for="start_date">Start date</label>
        <input type="date" id="start_date" name="start_date" value="2025-01-01">
      </div>
      <div>
        <label for="end_date">End date</label>
        <input type="date" id="end_date" name="end_date" value="2025-03-31">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="seed">Seed <span class="hint">(blank = random)</span></label>
        <input type="number" id="seed" name="seed" placeholder="e.g. 42">
      </div>
      <div>
        <label for="format">Export format</label>
        <select id="format" name="format">
          <option value="csv" selected>csv (one file per bank)</option>
          <option value="xlsx">xlsx (one workbook)</option>
        </select>
      </div>
    </div>

    <button type="submit" id="submit-btn">Generate</button>
  </form>

  <div id="status"></div>

  <script>
    const form = document.getElementById("run-form");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Generating…";
      statusEl.className = "info";
      statusEl.textContent = "Running the generator — this usually takes well under a minute.";

      try {
        const response = await fetch("/generate", {
          method: "POST",
          body: new FormData(form),
        });

        if (!response.ok) {
          const data = await response.json();
          statusEl.className = "error";
          statusEl.textContent = (data.errors || ["Unknown error."]).join("\n");
          return;
        }

        const blob = await response.blob();
        const disposition = response.headers.get("Content-Disposition") || "";
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : "aml_exercise.zip";

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        statusEl.className = "info";
        statusEl.textContent = `Done — downloaded ${filename}`;
      } catch (err) {
        statusEl.className = "error";
        statusEl.textContent = "Request failed: " + err;
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate";
      }
    });
  </script>
</body>
</html>
