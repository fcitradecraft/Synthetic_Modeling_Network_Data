# Ordinary major US trading-partner countries - used for legitimate
# (non-injected) international wire activity on IMPORT_EXPORT/
# MANUFACTURING/WHOLESALE_DISTRIBUTION companies (see
# generator/transactions.py's INTERNATIONAL_TRADE_ARCHETYPES). Kept
# entirely separate from config/high_risk_countries.yaml - this list is
# never used by inject_cty. Real countries, same rationale as
# high_risk_countries.yaml's own comment: country codes are regulatory/
# geographic reference data, not personal identifiers; counterparty
# names/BICs generated against this list are fictional.
