# ---------------------------------------------------------------------------
# RESTOCKING / COGS (companies only, variable_recurring - see
# config/transaction_categories.yaml). Sized as a percentage of the
# company's own revenue_monthly_target, frequency/rail set per archetype
# in generate_restocking_transactions(). Archetypes with no meaningful
# COGS (pure service/finance/real-estate businesses) are omitted entirely
# rather than given a 0% entry - they just don't get a restocking channel.
# ---------------------------------------------------------------------------
restocking_pct_of_revenue:
  RESTAURANT:              {pct: [0.28, 0.35], frequency: weekly,   payment_types: [ach, check]}
  RETAIL:                  {pct: [0.40, 0.55], frequency: biweekly, payment_types: [ach, wire, check]}
  GAS_STATION:              {pct: [0.75, 0.85], frequency: weekly,   payment_types: [ach, wire]}
  MANUFACTURING:            {pct: [0.45, 0.60], frequency: monthly,  payment_types: [ach, wire, check]}
  DELIVERY_LOGISTICS:       {pct: [0.10, 0.20], frequency: biweekly, payment_types: [ach, check]}
  IMPORT_EXPORT:            {pct: [0.55, 0.70], frequency: monthly,  payment_types: [wire, check]}
  WHOLESALE_DISTRIBUTION:   {pct: [0.60, 0.75], frequency: biweekly, payment_types: [ach, wire, check]}
  FACILITY_SERVICES:        {pct: [0.10, 0.20], frequency: monthly,  payment_types: [ach, check]}

# ---------------------------------------------------------------------------
# OWNER DISTRIBUTIONS (companies with an `owners` cell only - see
# scripts/assign_business_ownership.py, ~18 of 34 companies). Modest
# monthly draw as a percentage of actual monthly revenue in dollars
# (revenue_monthly_target x average_expense, same math restocking uses),
# split across joint owners by their ownership pct, paid from the company
# to each owner's personal account. Additional to, not instead of,
# whatever salary or self-employment income an owner already has - an
# owner-operator commonly draws both. DRAFT percentage, Rio's review.
# ---------------------------------------------------------------------------
owner_distribution_pct_of_revenue: [0.05, 0.15]

# ---------------------------------------------------------------------------
# PAYROLL (dedicated function - not the accepted-methods filter above)
# ---------------------------------------------------------------------------
# Biweekly amount, replacing the flat `random.uniform(4500,5500) * scaler`
# formula, which ran 1.5-2.4x above BLS-grounded wages for Low/Medium tiers.
# Only segments with an `employer` value in the current roster are payroll
# recipients (P1, P3, P5) - P2/P4/P6 have no employer and use the tables
# below instead.
payroll_biweekly:
  P1: [950, 1450]
  P3: [1750, 2700]
  P5: [3300, 5800]

# ---------------------------------------------------------------------------
# SELF-EMPLOYED CLIENT PAYMENTS (new channel - Finding A fix)
# ---------------------------------------------------------------------------
# The 6 self-employed persons in the current roster (employer is blank) have
# no income channel at all today. This models irregular client/customer
# payments instead of a biweekly paycheck - amount and frequency are both
# irregular, which is itself part of what makes self-employment income look
# realistic next to salaried payroll.
client_payment:
  P2: {amount: [50, 450],   per_month: [3, 6], payment_types: [p2p, cash, ach]}
  P4: {amount: [350, 2200], per_month: [2, 5], payment_types: [ach, check]}

# ---------------------------------------------------------------------------
# UNEARNED INCOME (new channel - P6, Finding A fix for the 2 unemployed persons)
# ---------------------------------------------------------------------------
# Chad Harrison and David Caladan: Unemployed + High income_level. Confirmed
# by Rio 2026-07-10 as explained unearned income (trust distribution,
# investment income, rental income), not a deliberately unexplained-wealth
# pattern. Modeled as a periodic distribution rather than a paycheck.
unearned_income:
  P6: {amount: [2500, 9000], frequency: monthly, payment_types: [ach, wire]}

# ---------------------------------------------------------------------------
# ATM MECHANICS (per-account daily cap, by person segment)
# ---------------------------------------------------------------------------
# Real ATMs dispense in $20 multiples (no change) and cap daily withdrawals.
# Applied only to cash withdrawals sourced from a BEnt whose name identifies
# it as an ATM (vs a branch/teller) - see get_bent_type() in transactions.py.
# Branch/teller cash is exact-amount and uncapped; once an account's ATM
# cap is hit for the day, further cash need for that day routes to a
# branch/teller withdrawal instead. DRAFT - reasonable estimates, not tied
# to any specific bank's actual limits.
atm_daily_limit:
  P1: 300
  P2: 300
  P3: 500
  P4: 500
  P5: 800
  P6: 800

# ---------------------------------------------------------------------------
# BUSINESS OTC CASH (companies only, cash-heavy archetypes only). Weekly
# bulk till/register deposit (the accumulated cash from a week of sales
# going to the bank) and a smaller, separate weekly withdrawal to restock
# the register with change - both always over-the-counter/branch, never
# ATM (see get_bent_type() / choose_cash_withdrawal() in transactions.py).
# Deposit is sized as a percentage of the company's own target monthly
# revenue (revenue_monthly_target x average_expense) rather than a flat
# dollar range - retuned 2026-07-14, since the flat range (scaled by
# transaction_scaler) had drifted to represent an unrealistic ~48% cash
# share once real revenue targets were established. Percentages reflect
# FFIEC cash-intensive-business guidance: gas stations/convenience stores
# are the most cash-intensive of the three, restaurants/retail lower and
# increasingly card-dominant. DRAFT, Rio's to retune.
# ---------------------------------------------------------------------------
business_cash_deposit_pct_of_revenue:
  RESTAURANT:   [0.10, 0.12]
  RETAIL:       [0.08, 0.10]
  GAS_STATION:  [0.18, 0.20]

business_cash_withdrawal_weekly:
  RESTAURANT:   [150, 500]
  RETAIL:       [150, 400]
  GAS_STATION:  [150, 400]

# ---------------------------------------------------------------------------
# LARGE PERSONAL OTC WITHDRAWAL (persons only) - an occasional, one-off
# large cash withdrawal from savings for a big purchase (e.g. a used car),
# not tied to any specific merchant purchase - a real bank statement shows
# the withdrawal, not what the cash was later spent on. Always
# branch-sourced (well beyond any ATM daily cap anyway). At most one per
# person per run. DRAFT, Rio's call 2026-07-10.
# ---------------------------------------------------------------------------
large_personal_withdrawal:
  probability: 0.12
  amount:
    P1: [2000, 6000]
    P2: [2000, 6000]
    P3: [3000, 10000]
    P4: [3000, 10000]
    P5: [5000, 25000]
    P6: [5000, 25000]

# ---------------------------------------------------------------------------
# CASHIER'S CHECK VIA CASH-WITHDRAWAL-INTO-GL (persons only) - legitimate,
# not a laundering typology. Models the real teller mechanic where buying a
# cashier's check runs through the bank as a cash withdrawal from the
# customer's account (the visible, potentially cash-monitoring-triggering
# leg) funding a deposit into the bank's own cashier's-check GL/suspense
# account (the offsetting record, see
# generator/transactions.py::generate_c_check_gl_transactions). This is a
# real false-positive pattern: the withdrawal alone can look like ordinary
# structuring/excessive-cash activity until the offsetting c_check is
# found - exactly the "alert clearing" skill the exercise trains. At most
# one per person per run, same teller visit (no clearing float - that's for
# checks moving between two external parties). DRAFT, Rio's call
# 2026-07-11.
# ---------------------------------------------------------------------------
c_check_gl_purchase:
  probability: 0.10
  amount:
    P1: [500, 3000]
    P2: [500, 3000]
    P3: [750, 5000]
    P4: [750, 5000]
    P5: [1500, 10000]
    P6: [1500, 10000]
