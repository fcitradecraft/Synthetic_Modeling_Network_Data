    - COMP1013  # Couture Designs - Clothing Retailers
    - COMP1014  # Brittany's - Clothing Retailers
    - COMP1015  # Couture Designs - Clothing Retailers
    - COMP1022  # Mackeys - Food Services and Drinking Places
    - COMP1026  # The Melange Lounge LLC
    - COMP1027  # Arrakis Cantina & Bar
    - COMP1028  # Giedi Prime Gastropub
    - COMP1031  # Bene Gesserit Bistro
    - COMP1032  # Kwisatz Kitchen Inc
