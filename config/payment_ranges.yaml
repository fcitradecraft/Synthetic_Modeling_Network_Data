rent_monthly:
  persons:
    P1: [700, 1000]
    P2: [700, 1000]
    P3: [1100, 1600]
    P4: [1100, 1600]
    P5: [1800, 3000]
    P6: [1800, 3000]
  companies:
    RESTAURANT:             [2500, 6000]
    RETAIL:                 [2000, 5000]
    GAS_STATION:             [3000, 7000]
    MANUFACTURING:           [4000, 12000]
    PROFESSIONAL_SERVICES:   [1500, 4000]
    REAL_ESTATE:             [1500, 4000]
    DELIVERY_LOGISTICS:      [1500, 4000]
    FINANCIAL_SERVICES:      [2000, 6000]
    IMPORT_EXPORT:           [2500, 7000]
    WHOLESALE_DISTRIBUTION:  [3000, 8000]
    FACILITY_SERVICES:       [1500, 4000]

# rent_payment_mix - drawn once per payer, reused every month (same
# per-payer-fixed-habit mechanic as the rent amount/day-of-month). Persons
# skew heavily ach (autopay/portal); commercial leases stay more check-heavy.
# DRAFT ratios, 2026-07-11.
rent_payment_mix:
  persons:   {ach: 0.75, check: 0.25}
  companies: {ach: 0.55, check: 0.45}

# ---------------------------------------------------------------------------
