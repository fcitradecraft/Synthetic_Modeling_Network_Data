# Payment-rail value/volume calibration, researched and segmented 2026-07-10.
# See CLAUDE memory / session notes for the sourced research memo this was
# built from (Fed Diary of Consumer Payment Choice, Nacha, BLS, Fedwire,
# JPMorgan Chase Institute small-business study, etc.) - every number below
# is a reasonable estimate extrapolated from that research, not law. Amounts
# are USD, already at real-world scale (no additional multiplier needed for
# the person tables; company tables get multiplied by the entity's own
# `transaction_scaler` column downstream, same as `average_expense` already is).
#
# HOW TO EDIT: every range below is a plain [min, max] pair. To make a
# segment's P2P spending bigger, change payment_type_ranges.persons.<seg>.p2p.
# To move a company from one segment to another, cut its entity_id from one
# list under company_segments and paste it into another. Nothing else in the
# codebase needs to change for either edit to take effect.

# ---------------------------------------------------------------------------
# SEGMENT DEFINITIONS
# ---------------------------------------------------------------------------

# Person segment = f(income_level, employment_status). Both columns already
# exist in Combined_Data for all 22 persons - no new schema field needed.
# Rows marked DRAFT - no case don't occur in the current 22-person roster;
# they're filled in defensively so a future roster addition doesn't crash.
person_segment_matrix:
  Low:
    Employed: P1
    Self-employed: P2
    Unemployed: P1        # DRAFT - no case today; falls back to P1 (low, no client-payment channel)
  Medium:
    Employed: P3
    Self-employed: P4
    Unemployed: P3         # DRAFT - no case today
  High:
    Employed: P5
    Self-employed: P5      # DRAFT - no case today; treated as P5
    Unemployed: P6          # confirmed by Rio 2026-07-10: explained unearned income
                            # (trust/investment/rental), not deliberately unexplained wealth

# Company segment: explicit assignment by entity_id, not a NAICS-code
# formula - 11 of 34 companies have no naics_description populated (known
# pre-existing gap, see project memory), so a formula can't cover all 34.
# Classified by hand from name + naics_description where present.
#
# Expanded 2026-07-10 from 3 broad buckets (retail/F&B, manufacturing,
# professional) into 11 finer industry archetypes - Rio's call: a
# restaurant's restocking rhythm looks nothing like a gas station's or a
# real estate office's, so one "consumer-facing retail" bucket was too
# coarse for realistic overhead/revenue-mix modeling (see
# config/transaction_categories.yaml and the rent/utilities/restocking/
# revenue_mix tables below).
company_segments:
  RESTAURANT:  # cash+card heavy revenue, frequent perishable restocking
    - COMP1022  # Mackeys - Food Services and Drinking Places
    - COMP1026  # The Melange Lounge LLC
    - COMP1027  # Arrakis Cantina & Bar
    - COMP1028  # Giedi Prime Gastropub
    - COMP1031  # Bene Gesserit Bistro
    - COMP1032  # Kwisatz Kitchen Inc
    - COMP1034  # Chani's Kitchen & Catering
  RETAIL:  # card+cash revenue, periodic inventory restocking
    - COMP1010  # Sahara - General Merchandise Retailers
    - COMP1013  # Couture Designs - Clothing Retailers
    - COMP1014  # Brittany's - Clothing Retailers
    - COMP1015  # Couture Designs - Clothing Retailers
  GAS_STATION:  # high-volume cash+card, frequent fuel restocking
    - COMP1011  # Great Gas
    - COMP1012  # Dinoco
  MANUFACTURING:  # B2B ACH/wire/check only, near-zero cash, raw-material restocking
    - COMP1023  # Trailers by Tom - Motor Home Manufacturing
    - COMP1001  # Charmont Paper Products
    - COMP1003  # Renewal by Gerald - Compost Manufacturing
    - COMP1004  # Graham-Potts - Construction Machinery Manufacturing
    - COMP1005  # Mccormick Ltd - Measuring/Controlling Device Manufacturing
    - COMP1006  # Marcus Furniture
    - COMP1007  # Rio Titan - Gold/Silver Ore Mining
    - COMP1009  # Generators and Trasformers Inc
  PROFESSIONAL_SERVICES:  # check/ACH/wire, office lease, no restocking
    - COMP1002  # Hopkins, Branch and Flores - Business Associations
  REAL_ESTATE:  # wire-heavy (closings/commissions), office lease, no restocking
    - COMP1019  # Golden Key Realtors
    - COMP1020  # KW Homes
  DELIVERY_LOGISTICS:  # ACH/check service revenue + P2P tips, vehicle/fuel overhead
    - COMP1016  # Speedee Delivery
    - COMP1017  # Mr. Delivery
  FINANCIAL_SERVICES:  # wire/check dominant, minimal cash/card, no restocking
    - COMP1018  # Grilli and Gallegos - Funds, Trusts and Other Financial Vehicles
    - COMP1024  # TADECO LLC - fbo F. Markos Trust
    - COMP1033  # Corrino Capital Partners
  IMPORT_EXPORT:  # large wire-heavy international trade, bulk inventory restocking
    - COMP1025  # Spice Flow GmbH - US Operations
    - COMP1030  # Dune Imports & Exports Inc
  WHOLESALE_DISTRIBUTION:  # B2B ACH/check, bulk restocking, warehouse lease
    - COMP1029  # Fremen Food Distributors LLC
  FACILITY_SERVICES:  # ACH/check service contracts, vehicle/equipment overhead
    - COMP1021  # Office Waste Retrieval
    - COMP1008  # Seaside Dock Management - Marinas

# ---------------------------------------------------------------------------
# ORDINARY-SPENDING RANGES (the type/amount consistency fix)
# ---------------------------------------------------------------------------
# Used by generate_profile_transactions' legit-purchase loop and by
# generate_company_revenue_transactions. Amount is still drawn from the
# counterparty's average_expense (unchanged - that field is already
# hand-calibrated across 171 merchants + 34 companies). payment_type is then
# chosen only from among the counterparty's accepted methods whose range
# here actually contains that amount - this is the fix for payment_type and
# amount being picked independently (e.g. a $30,000 purchase rolling as P2P).
#
# Card types (ccard/credit/debit/pos) are kept distinct per Rio's call
# 2026-07-10, not consolidated into one "card" type, even though their
# ranges below are close - they're separately editable if real behavior
# diverges later (e.g. credit skewing to larger/revolving purchases).
# Sanity ceiling on a merchant's average_expense before it drives a
# purchase amount in generate_profile_transactions' merchant-purchase loop.
# Backstop against bad data (e.g. a merchant row with a five/six-figure
# "average" walk-in purchase) rather than a realism tune - $10,000 sits
# comfortably above the highest legitimate values already in the roster
# (Couture Designs tops out at $8,000, Cottage Designs at $6,000).
max_merchant_average_expense: 10000

# CHECK CLEARING FLOAT - days between the debit leg (payer writes/clears)
# and the credit leg (payee deposits it), layered on top of
# generate_post_date's existing 0-3-business-day posting lag. A cashier's
# check is bank-guaranteed and tied to a near-term purpose, so it moves
# faster than a personal/business check. DRAFT ranges, 2026-07-11.
check_clearing_float:
  check:   [2, 10]
  c_check: [1, 5]

# SIZE-TIERED WIRE/CHECK RANGES (companies only) - business SIZE drives a
# wire or check's realistic range, not industry: a small business's wire
# floor is lower than a large one's, regardless of archetype. Size tier
# comes from a company's own transaction_scaler
# (get_company_size_tier, generator/transactions.py) - small <=0.75,
# mid <=1.5, large otherwise. Replaces the wire/check entries that used
# to live inside each archetype's payment_type_ranges.companies below.
# Rio's call, 2026-07-14 - DRAFT values, his to retune.
size_tiered_payment_ranges:
  wire:
    small: [2000, 15000]
    mid:   [8000, 150000]
    large: [8000, 5000000]  # ceiling raised 2026-07-15 (Rio's call): "larger businesses might send more than $2,000,000"
  check:
    small: [1000, 10000]
    mid:   [2500, 40000]
    large: [5000, 99999]

payment_type_ranges:
  persons:
    P1: {p2p: [10, 90],   ccard: [8, 90],  credit: [8, 100], debit: [8, 80],  pos: [8, 90],  wire: [1000, 5000],  check: [50, 500],   c_check: [500, 3000],  ach: [50, 3000],   cash: [40, 130]}
    P2: {p2p: [10, 120],  ccard: [8, 90],  credit: [8, 100], debit: [8, 80],  pos: [8, 90],  wire: [1000, 3000],  check: [50, 500],   c_check: [500, 3000],  ach: [50, 3000],   cash: [40, 150]}
    P3: {p2p: [15, 150],  ccard: [10, 150],credit: [10, 180],debit: [10, 130],pos: [10, 150],wire: [1500, 10000], check: [75, 1000],  c_check: [750, 5000],  ach: [75, 5000],   cash: [60, 160]}
    P4: {p2p: [15, 150],  ccard: [10, 150],credit: [10, 180],debit: [10, 130],pos: [10, 150],wire: [1500, 8000],  check: [75, 1000],  c_check: [750, 5000],  ach: [75, 5000],   cash: [60, 170]}
    P5: {p2p: [20, 200],  ccard: [15, 500],credit: [15, 600],debit: [15, 300],pos: [15, 500],wire: [3000, 25000], check: [150, 2500], c_check: [1500, 10000],ach: [150, 10000], cash: [80, 200]}
    P6: {p2p: [20, 200],  ccard: [15, 500],credit: [15, 600],debit: [15, 300],pos: [15, 500],wire: [2500, 9000],  check: [150, 2500], c_check: [1500, 10000],ach: [150, 9000],  cash: [80, 200]}
  # RESTAURANT/RETAIL/GAS_STATION ranges widened 2026-07-10: these
  # companies' actual average_expense values (populated by
  # scripts/recalibrate_transaction_volume.py) run $300-$5,800 per
  # company - a company-level average, not a single walk-in customer's
  # ticket - and vary widely company-to-company within an archetype. A
  # narrow cash/card band meant most individual companies' amount range
  # only overlapped one or two rails at all, so revenue_mix_weights had
  # nothing left to weight among. Widened cash/card to both span most of
  # that per-company range, so amount-eligibility doesn't silently
  # override the weights for a typical company.
  # RESTAURANT/RETAIL/GAS_STATION card/cash ranges shrunk 2026-07-14 to real
  # per-ticket scale (Fed/consumer-payments research: restaurant card
  # transactions average $29-34, general retail ~$81) - these now describe
  # an individual customer sale, since generate_daily_card_settlement
  # aggregates them into daily batch-deposit lines before they hit the
  # ledger (see that function's docstring). wire/check here are now only
  # consulted by non-revenue paths (a company paying a merchant, etc.) -
  # revenue itself draws wire/check amounts from size_tiered_payment_ranges
  # above instead (Rio's call, 2026-07-14: size drives wire/check, not
  # archetype).
  companies:
    RESTAURANT:             {ccard: [8, 90],   credit: [8, 100],  debit: [8, 80],   pos: [8, 90],   cash: [5, 90],     ach: [500, 3000],  check: [500, 3000],  c_check: [1000, 6000],  wire: [8000, 150000], p2p: [10, 80]}
    RETAIL:                 {ccard: [8, 150],  credit: [8, 180],  debit: [8, 120],  pos: [8, 150],  cash: [5, 80],     ach: [500, 3000],  check: [500, 3000],  c_check: [1000, 8000],  wire: [8000, 150000], p2p: [10, 60]}
    GAS_STATION:             {ccard: [8, 60],   credit: [8, 70],   debit: [8, 55],   pos: [8, 55],   cash: [5, 50],     ach: [200, 5000],  check: [200, 5000],  c_check: [1500, 10000], wire: [8000, 150000], p2p: [0, 0]}
    MANUFACTURING:           {ccard: [0, 0],    credit: [0, 0],    debit: [0, 0],    pos: [0, 0],    cash: [0, 0],      ach: [500, 10000], check: [500, 10000], c_check: [1000, 15000], wire: [2000, 25000],  p2p: [0, 0]}
    PROFESSIONAL_SERVICES:   {ccard: [20, 200], credit: [20, 250], debit: [20, 150], pos: [20, 200], cash: [0, 200],    ach: [300, 5000],  check: [300, 5000],  c_check: [1500, 15000], wire: [2000, 30000],  p2p: [0, 0]}
    REAL_ESTATE:             {ccard: [0, 100],  credit: [0, 100],  debit: [0, 100],  pos: [0, 100],  cash: [0, 200],    ach: [300, 5000],  check: [500, 10000], c_check: [2000, 20000], wire: [3000, 50000],  p2p: [0, 0]}
    DELIVERY_LOGISTICS:      {ccard: [10, 100], credit: [10, 100], debit: [10, 80],  pos: [10, 100], cash: [100, 800],  ach: [300, 3000],  check: [300, 3000],  c_check: [1000, 6000],  wire: [1000, 10000],  p2p: [10, 150]}
    FINANCIAL_SERVICES:      {ccard: [0, 0],    credit: [0, 0],    debit: [0, 0],    pos: [0, 0],    cash: [0, 100],    ach: [500, 8000],  check: [500, 10000], c_check: [2000, 20000], wire: [5000, 100000], p2p: [0, 0]}
    IMPORT_EXPORT:           {ccard: [0, 0],    credit: [0, 0],    debit: [0, 0],    pos: [0, 0],    cash: [0, 0],      ach: [500, 5000],  check: [1000, 10000],c_check: [2000, 20000], wire: [5000, 75000],  p2p: [0, 0]}
    WHOLESALE_DISTRIBUTION:  {ccard: [0, 50],   credit: [0, 50],   debit: [0, 50],   pos: [0, 50],   cash: [0, 300],    ach: [500, 8000],  check: [500, 8000],  c_check: [1500, 15000], wire: [2000, 25000],  p2p: [0, 0]}
    FACILITY_SERVICES:       {ccard: [0, 50],   credit: [0, 50],   debit: [0, 50],   pos: [0, 50],   cash: [0, 300],    ach: [300, 3000],  check: [300, 3000],  c_check: [1000, 6000],  wire: [1000, 10000],  p2p: [0, 0]}

# [0, 0] means "not realistic for this segment" - a MANUFACTURING company
# taking cash or P2P, or a FINANCIAL_SERVICES firm taking P2P, is exactly
# the kind of mismatch an investigator should be able to flag. The filter
# treats [0, 0] as "excludes this type even if accepted_payment_methods
# lists it" rather than silently allowing a $0 transaction.

# ---------------------------------------------------------------------------
# REVENUE-MIX WEIGHTS (by company archetype)
# ---------------------------------------------------------------------------
# Used by generate_company_revenue_transactions in place of a uniform
# random pick among amount-eligible payment types - a restaurant's revenue
# genuinely skews toward card+cash, a real estate office's toward wire.
# Weights only need to be proportional to each other (normalized over
# whichever subset is still amount-eligible at generation time), not sum
# to exactly 1. Archetypes with no restocking (PROFESSIONAL_SERVICES,
# REAL_ESTATE, FINANCIAL_SERVICES) still receive revenue, just no COGS
# outflow - see restocking_pct_of_revenue below.
# RESTAURANT/RETAIL/GAS_STATION cash weight lowered 2026-07-10: these
# archetypes now also get a dedicated weekly bulk OTC till deposit
# (business_cash_deposit_weekly below), so the per-transaction cash entry
# here is the occasional smaller cash sale that didn't make it into the
# till sweep, not the primary cash channel - keeping the old weight would
# double-count the same till cash twice.
revenue_mix_weights:
  # RESTAURANT/RETAIL ach/check dropped to near-zero 2026-07-14 - Nacha/Fed
  # research confirms ACH is overwhelmingly payroll/bill-pay/B2B vendor
  # settlement, not a rail a walk-in customer pays their tab on; check is
  # a rare catering/private-event invoice at most, not routine revenue. A
  # kept-but-tiny weight (not zero) still allows that rare case to occur.
  # Card/debit/pos are generated as aggregated daily settlement deposits,
  # not per-sale (see DAILY_SETTLEMENT_ARCHETYPES, generator/transactions.py).
  RESTAURANT:              {ccard: 0.34, debit: 0.32, pos: 0.24, cash: 0.09, ach: 0.005, check: 0.005}
  RETAIL:                  {ccard: 0.39, debit: 0.30, pos: 0.22, cash: 0.08, ach: 0.005, check: 0.005}
  GAS_STATION:              {ccard: 0.45, debit: 0.35, pos: 0.12, cash: 0.08}
  MANUFACTURING:            {ach: 0.45, check: 0.30, wire: 0.20, c_check: 0.05}
  PROFESSIONAL_SERVICES:    {ach: 0.35, check: 0.35, wire: 0.15, ccard: 0.15}
  REAL_ESTATE:              {wire: 0.55, check: 0.30, ach: 0.15}
  DELIVERY_LOGISTICS:       {ach: 0.35, check: 0.20, p2p: 0.20, cash: 0.15, ccard: 0.10}
  FINANCIAL_SERVICES:       {wire: 0.55, check: 0.30, ach: 0.15}
  IMPORT_EXPORT:            {wire: 0.65, check: 0.25, ach: 0.10}
  WHOLESALE_DISTRIBUTION:   {ach: 0.45, check: 0.35, wire: 0.20}
  FACILITY_SERVICES:        {ach: 0.45, check: 0.40, ccard: 0.15}

# ---------------------------------------------------------------------------
# EXPENSE-MIX WEIGHTS (persons, P1-P6) - person analog to revenue_mix_weights
# above. Used by generate_profile_transactions' merchant-purchase loop so
# payment_type isn't picked uniformly at random among every amount-eligible
# accepted method - real people overwhelmingly pay everyday purchases by
# card/cash, rarely by check. c_check is deliberately omitted (excluded from
# the weighted pool entirely) - a cashier's check for a routine purchase
# isn't realistic; that's covered by the dedicated c_check_gl_purchase
# mechanic instead. DRAFT weights, 2026-07-11.
# ---------------------------------------------------------------------------
expense_mix_weights:
  P1: {ccard: 0.20, credit: 0.10, debit: 0.30, pos: 0.15, cash: 0.15, ach: 0.05, check: 0.03, p2p: 0.02}
  P2: {ccard: 0.20, credit: 0.10, debit: 0.30, pos: 0.15, cash: 0.15, ach: 0.05, check: 0.03, p2p: 0.02}
  P3: {ccard: 0.25, credit: 0.15, debit: 0.28, pos: 0.12, cash: 0.10, ach: 0.06, check: 0.03, p2p: 0.01}
  P4: {ccard: 0.25, credit: 0.15, debit: 0.28, pos: 0.12, cash: 0.10, ach: 0.06, check: 0.03, p2p: 0.01}
  P5: {ccard: 0.30, credit: 0.20, debit: 0.22, pos: 0.10, cash: 0.08, ach: 0.06, check: 0.03, p2p: 0.01}
  P6: {ccard: 0.30, credit: 0.20, debit: 0.22, pos: 0.10, cash: 0.08, ach: 0.06, check: 0.03, p2p: 0.01}

# ---------------------------------------------------------------------------
# RENT/MORTGAGE (dedicated function, fixed_recurring - see
# config/transaction_categories.yaml). Drawn once per profile, same
# amount and same day-of-month every period. Company amounts are a base
# range multiplied by the company's own transaction_scaler, same pattern
# as average_expense.
