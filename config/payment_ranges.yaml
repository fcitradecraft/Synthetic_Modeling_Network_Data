# Payment-rail value/volume calibration, researched and segmented 2026-07-10.
# See CLAUDE memory / session notes for the sourced research memo this was
# built from (Fed Diary of Consumer Payment Choice, Nacha, BLS, Fedwire,
# JPMorgan Chase Institute small-business study, etc.) - every number below
# is a reasonable estimate extrapolated from that research, not law. Amounts
# are USD, already at real-world scale (no additional multiplier needed for
# the person tables; company tables get multiplied by the entity's own
# `transaction_scaler` column downstream, same as `average_expense` already is).
#
# HOW TO EDIT: every range below is a plain [min, max] pair. To make a
# segment's P2P spending bigger, change payment_type_ranges.persons.<seg>.p2p.
# To move a company from one segment to another, cut its entity_id from one
# list under company_segments and paste it into another. Nothing else in the
# codebase needs to change for either edit to take effect.

# ---------------------------------------------------------------------------
# SEGMENT DEFINITIONS
# ---------------------------------------------------------------------------

# Person segment = f(income_level, employment_status). Both columns already
# exist in Combined_Data for all 22 persons - no new schema field needed.
# Rows marked DRAFT - no case don't occur in the current 22-person roster;
# they're filled in defensively so a future roster addition doesn't crash.
person_segment_matrix:
  Low:
    Employed: P1
    Self-employed: P2
    Unemployed: P1        # DRAFT - no case today; falls back to P1 (low, no client-payment channel)
  Medium:
    Employed: P3
    Self-employed: P4
    Unemployed: P3         # DRAFT - no case today
  High:
    Employed: P5
    Self-employed: P5      # DRAFT - no case today; treated as P5
    Unemployed: P6          # confirmed by Rio 2026-07-10: explained unearned income
                            # (trust/investment/rental), not deliberately unexplained wealth

# Company segment: explicit assignment by entity_id, not a NAICS-code
# formula - 11 of 34 companies have no naics_description populated (known
# pre-existing gap, see project memory), so a formula can't cover all 34.
# Classified by hand from name + naics_description where present.
company_segments:
  C1:  # consumer-facing retail / food & beverage - cash+POS heavy, high frequency, small ticket
